[package]
name = "lininstall"
version = "3.0.0"
description = "Linux system utility with GPU driver manager, app installer and tweaks"
authors = ["NoCapScripts <nocapscripts@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["process", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
